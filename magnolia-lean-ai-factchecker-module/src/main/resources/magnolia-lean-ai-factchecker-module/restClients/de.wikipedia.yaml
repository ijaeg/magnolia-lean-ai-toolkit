baseUrl: https://de.wikipedia.org
restCalls:
  search:
    method: GET
    entityClass: com.fasterxml.jackson.databind.JsonNode
    path: /w/rest.php/v1/search/page
    headers: !include:/magnolia-lean-ai-factchecker-module/includes/userAgentHeader.yaml
    queryParameters:
      limit: 3
  summary:
    method: GET
    entityClass: com.fasterxml.jackson.databind.JsonNode
    path: /api/rest_v1/page/summary/{key}
    headers: !include:/magnolia-lean-ai-factchecker-module/includes/userAgentHeader.yaml
cacheConfiguration:
  expireIn: 0
timeoutConfiguration:
  readTimeout: 10
  fallbackToCache: false

